name: PR and Push — Lint & Build Check

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Next.js build
        run: pnpm build

      # Optional: run tests if you have them
      # - name: Run tests
      #   run: pnpm test

# Local verification notes:
# To validate locally before creating a PR, run the following in your macOS zsh terminal:
#
# pnpm install --frozen-lockfile
# pnpm lint
# pnpm build


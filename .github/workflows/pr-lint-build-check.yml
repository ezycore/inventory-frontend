name: PR and Push — Lint & Build Check

on:
  pull_request:
    branches:
      - development
      - main

concurrency:
  group: lint-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version comes from the "packageManager" field in package.json

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      # Fails when a help page quotes UI text the app no longer renders, or when a new sidebar
      # route is neither documented nor deferred in docs/help/BACKLOG.md. Self-contained — reads
      # only this repo, so it needs no sibling checkout.
      - name: Verify customer help docs
        run: pnpm run help:verify

      - name: Run Next.js build
        run: pnpm run build

      # Includes services/api/__tests__/invalidation.test.ts — the gate that fails when a new
      # mutation hook invalidates nothing, or an EFFECTS entry names a key no resource owns.
      # See docs/plan/query-invalidation.md.
      - name: Run tests
        run: pnpm test

# Local verification notes:
# To validate locally before creating a PR, run the following in your macOS zsh terminal:
#
# pnpm install --frozen-lockfile
# pnpm lint
# pnpm test
# pnpm build


name: Build & Deploy

on:
  push:
    branches: [rc, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ezycore/easystock-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the vX.Y.Z release tag after a production deploy
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        # The release comes from package.json (see CHANGELOG.md). Production images
        # are tagged with it (`:1.0.0`, the rollback handle); staging gets `-rc`.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=production" >> "$GITHUB_OUTPUT"
            echo "dir=production" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION-rc" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL is baked at BUILD time (§10.1) -> a per-environment image.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.ref_name == 'main' && secrets.NEXT_PUBLIC_API_URL_PROD || secrets.NEXT_PUBLIC_API_URL_STAGING }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ github.ref_name == 'main' && 'ezycore.com' || '' }}
            NEXT_PUBLIC_STOREFRONT_ROOT_DOMAIN=${{ github.ref_name == 'main' && 'ezycore.com' || '' }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.env.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.env.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Serialize deploys across all repos sharing this daemon so concurrent
            # `compose pull` / `image prune` can't corrupt each other's containerd leases.
            exec 9>/opt/easystock/.deploy.lock
            flock -w 600 9
            cd /opt/easystock/${{ steps.env.outputs.dir }}
            docker compose pull
            docker compose up -d
            docker image prune -f || true

      # Tag the release once production is actually running it. The version is
      # package.json's; an existing tag means it was not bumped for this deploy —
      # warn rather than fail, the deploy itself already succeeded. A tag pushed
      # with GITHUB_TOKEN starts no workflow, so this cannot redeploy.
      - name: Tag release
        if: github.ref_name == 'main'
        run: |
          TAG="v${{ steps.env.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::warning::$TAG already exists — package.json was not bumped, so this deploy is untagged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "${{ github.sha }}"
            git push origin "$TAG"
          fi

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ github.ref_name == 'main' && secrets.TELEGRAM_CHAT_ID_PROD || secrets.TELEGRAM_CHAT_ID_STAGING }}
          token: ${{ github.ref_name == 'main' && secrets.TELEGRAM_BOT_TOKEN_PROD || secrets.TELEGRAM_BOT_TOKEN_STAGING }}
          format: html
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} <b>${{ github.event.repository.name }}</b> v${{ steps.env.outputs.version }} → ${{ steps.env.outputs.tag }} (${{ job.status }})
            ${{ github.actor }}: ${{ github.event.head_commit.message }}
